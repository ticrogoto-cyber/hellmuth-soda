name: Live-Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: curl Listing + Hopfen-Detail + Vitamin-C-Hybrid
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

          echo "==============================================="
          echo "LIVE-PROBE Listing https://hellmuth-soda.de/zutaten/"
          echo "==============================================="
          curl -sS -o /tmp/listing.html -w "HTTP %{http_code}, size %{size_download} bytes, time %{time_total}s\n" \
            --max-time 15 -A "$UA" -H "Accept: text/html" \
            "https://hellmuth-soda.de/zutaten/?nocache=$(date +%s)"
          echo ""
          echo "--- COUNTS LIVE LISTING ---"
          echo "zutaten-tile: $(grep -oc 'zutaten-tile' /tmp/listing.html)"
          echo "data-name=:   $(grep -oc 'data-name=' /tmp/listing.html)"
          echo "ItemList:     $(grep -oc 'ItemList' /tmp/listing.html)"
          echo "og:type:      $(grep -oc 'og:type' /tmp/listing.html)"
          echo "<li:          $(grep -oc '<li' /tmp/listing.html)"
          echo "Total bytes:  $(wc -c < /tmp/listing.html)"
          echo ""
          echo "--- LAST-MODIFIED + ETag Header ---"
          curl -sI --max-time 15 -A "$UA" "https://hellmuth-soda.de/zutaten/" | grep -iE 'last-modified|etag|x-github|server|age|cache-control'
          echo ""
          echo "--- LISTING BODY first 1500 chars ---"
          head -c 1500 /tmp/listing.html
          echo ""
          echo ""
          echo "==============================================="
          echo "LIVE-PROBE Detail https://hellmuth-soda.de/zutaten/hopfen/"
          echo "==============================================="
          curl -sS -o /tmp/hopfen.html -w "HTTP %{http_code}, size %{size_download} bytes\n" \
            --max-time 15 -A "$UA" -H "Accept: text/html" \
            "https://hellmuth-soda.de/zutaten/hopfen/?nocache=$(date +%s)"
          echo ""
          echo "--- COUNTS HOPFEN ---"
          echo "Title:        $(grep -oP '<title>[^<]*</title>' /tmp/hopfen.html | head -1)"
          echo "Hopfen-Hits:  $(grep -oc 'Hopfen' /tmp/hopfen.html)"
          echo "Wirkung-Hits: $(grep -oc 'Wirkung' /tmp/hopfen.html)"
          echo "<p>-Tags:     $(grep -oc '<p' /tmp/hopfen.html)"
          echo "JSON-LD:      $(grep -oc 'application/ld+json' /tmp/hopfen.html)"
          echo "Total bytes:  $(wc -c < /tmp/hopfen.html)"
          echo ""
          echo "--- HOPFEN BODY first 1500 chars ---"
          head -c 1500 /tmp/hopfen.html
          echo ""
          echo ""
          echo "==============================================="
          echo "LIVE-PROBE Detail Vitamin C — Hybrid-Wirkung-Test"
          echo "==============================================="
          # Sleep um Pages-Edge-Cache nach dem Vitamin-C-Commit (6ae8378)
          # Zeit zur Invalidierung zu geben. max-age=600 lt. live-probe-Header.
          sleep 30
          curl -sS -o /tmp/vitc.html -w "HTTP %{http_code}, size %{size_download} bytes\n" \
            --max-time 15 -A "$UA" -H "Accept: text/html" -H "Cache-Control: no-cache" \
            "https://hellmuth-soda.de/zutaten/vitamin-c/?nocache=$(date +%s)"
          echo ""
          echo "--- LAST-MODIFIED ---"
          curl -sI --max-time 15 -A "$UA" "https://hellmuth-soda.de/zutaten/vitamin-c/" | grep -iE 'last-modified|etag|age|cache-control'
          echo ""
          echo "--- FÜNF SCHLÜSSEL-STRINGS (User-Spec) ---"
          for needle in "Symptomverwaltung" "TET-Enzyme" "erfährt nicht, dass es sie gibt" "Saft aus der Frucht ist Therapie" "verkauft dir stattdessen Bisphosphonate"; do
            count=$(grep -oc "$needle" /tmp/vitc.html)
            ctx=$(grep -oE ".{0,60}$needle.{0,60}" /tmp/vitc.html | head -1)
            echo "  [$count] '$needle'"
            echo "      → $ctx"
          done
          echo ""
          echo "--- WIRKUNG <p>-COUNT ---"
          # Zähle nur Wirkung-Paragraphs (zutaten-line ohne zutaten-quellen, ohne "Werbung:")
          # Approximation: grep auf class="zutaten-line"> direkt (ohne weitere Klasse)
          echo "<p class=zutaten-line> (alle): $(grep -oc 'class="zutaten-line">' /tmp/vitc.html)"
          echo "Quellen-Block:                  $(grep -oc 'zutaten-quellen' /tmp/vitc.html)"
          echo "Werbung-Label:                  $(grep -oc 'Werbung:' /tmp/vitc.html)"
          echo ""
          echo "==============================================="
          echo "KONSOLIDIERUNGS-WELLE: Such-Dropdown + Tokio + MCT + Reishi"
          echo "==============================================="
          # Such-JS-Datei mit Cache-Bust v=3 zur Verifikation der Label-Fix
          curl -sS -o /tmp/search.js -w "HTTP %{http_code}, size %{size_download} bytes\n" \
            --max-time 15 -A "$UA" "https://hellmuth-soda.de/search.js?v=3&nocache=$(date +%s)"
          echo "--- search.js Such-Dropdown-Label-Logik ---"
          grep -A1 "items.push" /tmp/search.js | grep -A1 "Substanz\|unterkategorie\|toUpperCase" | head -6
          echo ""
          echo "--- Zink-Carnosin live: \"In Tokio\" present? ---"
          curl -sS -A "$UA" "https://hellmuth-soda.de/zutaten/zink-carnosin/?nocache=$(date +%s)" | grep -oE "In Tokio[^<.]{0,60}\.|In Tokyo[^<.]{0,60}\." | head -2
          echo ""
          echo "--- MCT-Öl live: szenario-Attribut auf Tile? ---"
          curl -sS -A "$UA" "https://hellmuth-soda.de/zutaten/?nocache=$(date +%s)" | grep -oE 'data-slug="mct-oel"[^>]*data-szenario="[^"]*"|data-slug="mct-oel"[^>]*data-name=' | head -2
          echo ""
          echo "--- Reishi live: szenario=3 auf Tile? ---"
          curl -sS -A "$UA" "https://hellmuth-soda.de/zutaten/?nocache=$(date +%s)" | grep -oE 'data-slug="glaenzender-lackporling"[^>]*data-szenario="[^"]*"' | head -2
          echo ""
          echo "==============================================="
          echo "REPO-BLOB-SHA für Vergleich"
          echo "==============================================="
          git rev-parse HEAD || true
          git ls-tree HEAD zutaten/vitamin-c/index.html search.js || true
