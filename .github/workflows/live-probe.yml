name: Live-Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-probe.yml'
      - 'zutaten/substances.js'
      - 'zutaten/zutaten.css'
      - 'zutaten/zutaten.js'
      - 'search.js'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: curl Listing + Hopfen-Detail + Vitamin-C-Hybrid
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

          echo "==============================================="
          echo "LIVE-PROBE Listing https://hellmuth-soda.de/zutaten/"
          echo "==============================================="
          curl -sS -o /tmp/listing.html -w "HTTP %{http_code}, size %{size_download} bytes, time %{time_total}s\n" \
            --max-time 15 -A "$UA" -H "Accept: text/html" \
            "https://hellmuth-soda.de/zutaten/?nocache=$(date +%s)"
          echo ""
          echo "--- COUNTS LIVE LISTING ---"
          echo "zutaten-tile: $(grep -oc 'zutaten-tile' /tmp/listing.html)"
          echo "data-name=:   $(grep -oc 'data-name=' /tmp/listing.html)"
          echo "ItemList:     $(grep -oc 'ItemList' /tmp/listing.html)"
          echo "og:type:      $(grep -oc 'og:type' /tmp/listing.html)"
          echo "<li:          $(grep -oc '<li' /tmp/listing.html)"
          echo "Total bytes:  $(wc -c < /tmp/listing.html)"
          echo ""
          echo "--- LAST-MODIFIED + ETag Header ---"
          curl -sI --max-time 15 -A "$UA" "https://hellmuth-soda.de/zutaten/" | grep -iE 'last-modified|etag|x-github|server|age|cache-control'
          echo ""
          echo "--- LISTING BODY first 1500 chars ---"
          head -c 1500 /tmp/listing.html
          echo ""
          echo ""
          echo "==============================================="
          echo "LIVE-PROBE Detail https://hellmuth-soda.de/zutaten/hopfen/"
          echo "==============================================="
          curl -sS -o /tmp/hopfen.html -w "HTTP %{http_code}, size %{size_download} bytes\n" \
            --max-time 15 -A "$UA" -H "Accept: text/html" \
            "https://hellmuth-soda.de/zutaten/hopfen/?nocache=$(date +%s)"
          echo ""
          echo "--- COUNTS HOPFEN ---"
          echo "Title:        $(grep -oP '<title>[^<]*</title>' /tmp/hopfen.html | head -1)"
          echo "Hopfen-Hits:  $(grep -oc 'Hopfen' /tmp/hopfen.html)"
          echo "Wirkung-Hits: $(grep -oc 'Wirkung' /tmp/hopfen.html)"
          echo "<p>-Tags:     $(grep -oc '<p' /tmp/hopfen.html)"
          echo "JSON-LD:      $(grep -oc 'application/ld+json' /tmp/hopfen.html)"
          echo "Total bytes:  $(wc -c < /tmp/hopfen.html)"
          echo ""
          echo "--- HOPFEN BODY first 1500 chars ---"
          head -c 1500 /tmp/hopfen.html
          echo ""
          echo ""
          echo "==============================================="
          echo "LIVE-PROBE Detail Vitamin C — Hybrid-Wirkung-Test"
          echo "==============================================="
          # Sleep um Pages-Edge-Cache nach dem Vitamin-C-Commit (6ae8378)
          # Zeit zur Invalidierung zu geben. max-age=600 lt. live-probe-Header.
          sleep 30
          curl -sS -o /tmp/vitc.html -w "HTTP %{http_code}, size %{size_download} bytes\n" \
            --max-time 15 -A "$UA" -H "Accept: text/html" -H "Cache-Control: no-cache" \
            "https://hellmuth-soda.de/zutaten/vitamin-c/?nocache=$(date +%s)"
          echo ""
          echo "--- LAST-MODIFIED ---"
          curl -sI --max-time 15 -A "$UA" "https://hellmuth-soda.de/zutaten/vitamin-c/" | grep -iE 'last-modified|etag|age|cache-control'
          echo ""
          echo "--- FÜNF SCHLÜSSEL-STRINGS (User-Spec) ---"
          for needle in "Symptomverwaltung" "TET-Enzyme" "erfährt nicht, dass es sie gibt" "Saft aus der Frucht ist Therapie" "verkauft dir stattdessen Bisphosphonate"; do
            count=$(grep -oc "$needle" /tmp/vitc.html)
            ctx=$(grep -oE ".{0,60}$needle.{0,60}" /tmp/vitc.html | head -1)
            echo "  [$count] '$needle'"
            echo "      → $ctx"
          done
          echo ""
          echo "--- WIRKUNG <p>-COUNT ---"
          # Zähle nur Wirkung-Paragraphs (zutaten-line ohne zutaten-quellen, ohne "Werbung:")
          # Approximation: grep auf class="zutaten-line"> direkt (ohne weitere Klasse)
          echo "<p class=zutaten-line> (alle): $(grep -oc 'class="zutaten-line">' /tmp/vitc.html)"
          echo "Quellen-Block:                  $(grep -oc 'zutaten-quellen' /tmp/vitc.html)"
          echo "Werbung-Label:                  $(grep -oc 'Werbung:' /tmp/vitc.html)"
          echo ""
          echo "==============================================="
          echo "KONSOLIDIERUNGS-WELLE: Such-Dropdown + Tokio + MCT + Reishi"
          echo "==============================================="
          # Such-JS-Datei mit Cache-Bust v=3 zur Verifikation der Label-Fix
          curl -sS -o /tmp/search.js -w "HTTP %{http_code}, size %{size_download} bytes\n" \
            --max-time 15 -A "$UA" "https://hellmuth-soda.de/search.js?v=3&nocache=$(date +%s)"
          echo "--- search.js Such-Dropdown-Label-Logik ---"
          grep -A1 "items.push" /tmp/search.js | grep -A1 "Substanz\|unterkategorie\|toUpperCase" | head -6
          echo ""
          echo "--- Zink-Carnosin live: \"In Tokio\" present? ---"
          curl -sS -A "$UA" "https://hellmuth-soda.de/zutaten/zink-carnosin/?nocache=$(date +%s)" | grep -oE "In Tokio[^<.]{0,60}\.|In Tokyo[^<.]{0,60}\." | head -2
          echo ""
          echo "--- MCT-Öl live: szenario-Attribut auf Tile? ---"
          curl -sS -A "$UA" "https://hellmuth-soda.de/zutaten/?nocache=$(date +%s)" | grep -oE 'data-slug="mct-oel"[^>]*data-szenario="[^"]*"|data-slug="mct-oel"[^>]*data-name=' | head -2
          echo ""
          echo "--- Reishi live: szenario=3 auf Tile? ---"
          curl -sS -A "$UA" "https://hellmuth-soda.de/zutaten/?nocache=$(date +%s)" | grep -oE 'data-slug="glaenzender-lackporling"[^>]*data-szenario="[^"]*"' | head -2
          echo ""
          echo "==============================================="
          echo "L-THEANIN SZ1-NEUFASSUNG"
          echo "==============================================="
          curl -sS -o /tmp/ltheanin.html -w "HTTP %{http_code}, size %{size_download} bytes\n" \
            --max-time 15 -A "$UA" -H "Cache-Control: no-cache" \
            "https://hellmuth-soda.de/zutaten/l-theanin/?nocache=$(date +%s)"
          echo ""
          echo "--- DREI SCHLÜSSEL-STRINGS (User-Spec) ---"
          for needle in "Alpha-Wellen sind kein Fokus-Marker" "Dosis-Lüge macht den Rest" "Schlaf, den du dir einredest"; do
            count=$(grep -oc "$needle" /tmp/ltheanin.html)
            ctx=$(grep -oE ".{0,60}$needle.{0,60}" /tmp/ltheanin.html | head -1)
            echo "  [$count] '$needle'"
            echo "      → $ctx"
          done
          echo ""
          echo "--- L-Theanin Tile auf Listing (data-szenario=1) ---"
          curl -sS -A "$UA" "https://hellmuth-soda.de/zutaten/?nocache=$(date +%s)" | grep -oE 'data-slug="l-theanin"[^>]*data-szenario="[^"]*"' | head -2
          echo ""
          echo "--- Quellen-Block im Detail (3 Belege im Name-Jahr-Format) ---"
          grep -oE 'Quellen:[^<]{0,120}' /tmp/ltheanin.html | head -1
          echo ""
          echo "--- Wirkungs-Absätze (6 zutaten-line erwartet) ---"
          echo "<p class=zutaten-line> (alle): $(grep -oc 'class="zutaten-line"' /tmp/ltheanin.html)"
          echo ""
          echo "==============================================="
          echo "STRING-EDIT-WELLE: 12 Pflicht-Phrasen (slug|needle|expected)"
          echo "==============================================="
          probes=(
            "bacillus-coagulans|und Backofen.|1"
            "bacillus-coagulans|Das ist Biochemie|0"
            "aktivkohle|Der Smoothie kennt keine Indikation|1"
            "magnesium|Gerechtfertigte Indikation|1"
            "magnesium|Das Etikett verrät davon nichts|1"
            "magnesium|Slutsky 2010|1"
            "sulforaphan|Das Problem liegt in der Bioverfügbarkeit. Aktive Myrosinase|1"
            "l-theanin|Sie wurde nicht klinisch belegt, sondern aus einem Hirnstrom-Diagramm|1"
            "l-theanin|Schlaf, den du dir einredest|1"
            "hopfen|Dass die Monotherapie-Evidenz|1"
            "brennnessel|Die Wurzel macht die Prostata|1"
            "brennnessel|Riehemann 1999|1"
          )
          fail=0
          for probe in "${probes[@]}"; do
            IFS='|' read -r slug needle expected <<< "$probe"
            curl -sS -A "$UA" -H "Cache-Control: no-cache" \
              "https://hellmuth-soda.de/zutaten/$slug/?bust=$(date +%s)" > /tmp/probe.html
            count=$(grep -oc "$needle" /tmp/probe.html)
            if [ "$count" = "$expected" ]; then
              mark="✓"
            else
              mark="✗"
              fail=$((fail + 1))
            fi
            echo "  $mark [$count/$expected] $slug: '$needle'"
          done
          echo ""
          echo "STRING-EDIT-WELLE SUMMARY: $fail Abweichungen"
          echo ""
          echo "==============================================="
          echo "AUFRUFE-WELLE: Listing + Startseite + 3 News-Detail-URLs"
          echo "==============================================="
          aufrufe_urls=(
            "https://hellmuth-soda.de/"
            "https://hellmuth-soda.de/news/"
            "https://hellmuth-soda.de/news/science/wenn-die-glia-den-strom-nicht-mehr-abfuhrt/"
            "https://hellmuth-soda.de/news/hellmuth/alkoholfreies-bier-ist-kein-ausstieg/"
            "https://hellmuth-soda.de/news/science/alzheimer-hat-eine-zweite-schrift/"
          )
          aufrufe_fail=0
          for url in "${aufrufe_urls[@]}"; do
            curl -sS -A "$UA" -H "Cache-Control: no-cache" -o /tmp/aufrufe.html \
              "$url?bust=$(date +%s)"
            uc=$(grep -oc 'AUFRUFE' /tmp/aufrufe.html)
            lc=$(grep -oc 'aufrufe' /tmp/aufrufe.html)
            ce=$(grep -oc 'counters\.js' /tmp/aufrufe.html)
            wc=$(grep -oc 'hellmuth-counters' /tmp/aufrufe.html)
            short=$(echo "$url" | sed 's|https://hellmuth-soda.de||')
            echo "  $short"
            echo "    AUFRUFE:               $uc (erwartet 0)"
            echo "    aufrufe:               $lc (erwartet 0)"
            echo "    counters.js-Script:    $ce (erwartet 0)"
            echo "    hellmuth-counters URL: $wc (erwartet 0)"
            if [ "$uc" != "0" ] || [ "$lc" != "0" ] || [ "$ce" != "0" ] || [ "$wc" != "0" ]; then
              aufrufe_fail=$((aufrufe_fail + 1))
            fi
          done
          echo ""
          echo "AUFRUFE-WELLE SUMMARY: $aufrufe_fail URL(s) mit Abweichung"
          echo ""
          echo "==============================================="
          echo "EDGE-CACHE-DIAGNOSE: Magnesium ±Bust gegen Live"
          echo "==============================================="
          echo "--- ohne Bust (normaler GET) ---"
          curl -sS -A "$UA" -o /tmp/mg-plain.html -w "HTTP %{http_code}, size %{size_download} bytes\n" --max-time 15 \
            "https://hellmuth-soda.de/zutaten/magnesium/"
          echo "Header (ohne Bust):"
          curl -sI --max-time 15 -A "$UA" "https://hellmuth-soda.de/zutaten/magnesium/" | grep -iE 'last-modified|etag|age|cache-control|x-served'
          echo "  Grep 'Gerechtfertigte':             $(grep -oc 'Gerechtfertigte' /tmp/mg-plain.html)"
          echo "  Grep 'Das Etikett verrät davon':    $(grep -oc 'Das Etikett verrät davon' /tmp/mg-plain.html)"
          echo "  Grep 'Slutsky 2010':                $(grep -oc 'Slutsky 2010' /tmp/mg-plain.html)"
          echo ""
          echo "--- mit Bust + no-cache-Header ---"
          curl -sS -A "$UA" -H "Cache-Control: no-cache" -o /tmp/mg-bust.html -w "HTTP %{http_code}, size %{size_download} bytes\n" --max-time 15 \
            "https://hellmuth-soda.de/zutaten/magnesium/?bust=$(date +%s)"
          echo "Header (mit Bust):"
          curl -sI --max-time 15 -A "$UA" -H "Cache-Control: no-cache" "https://hellmuth-soda.de/zutaten/magnesium/?bust=$(date +%s)" | grep -iE 'last-modified|etag|age|cache-control|x-served'
          echo "  Grep 'Gerechtfertigte':             $(grep -oc 'Gerechtfertigte' /tmp/mg-bust.html)"
          echo "  Grep 'Das Etikett verrät davon':    $(grep -oc 'Das Etikett verrät davon' /tmp/mg-bust.html)"
          echo "  Grep 'Slutsky 2010':                $(grep -oc 'Slutsky 2010' /tmp/mg-bust.html)"
          echo ""
          echo "--- Byte-Diff (Bust-Version sollte identisch oder neuer sein) ---"
          plain_size=$(wc -c < /tmp/mg-plain.html)
          bust_size=$(wc -c < /tmp/mg-bust.html)
          echo "  ohne Bust: $plain_size bytes"
          echo "  mit Bust:  $bust_size bytes"
          if [ "$plain_size" = "$bust_size" ] && diff -q /tmp/mg-plain.html /tmp/mg-bust.html >/dev/null 2>&1; then
            echo "  → IDENTISCH (Edge-Cache aktuell oder beide identisch)"
          else
            echo "  → UNTERSCHIED (Edge-Cache hält alte Version, Bust holt neue)"
          fi
          echo ""
          echo "==============================================="
          echo "CACHE-BUST STAND auf Listing"
          echo "==============================================="
          curl -sS -A "$UA" "https://hellmuth-soda.de/zutaten/?nocache=$(date +%s)" | grep -oE 'zutaten\.css\?v=[0-9]+|zutaten\.js\?v=[0-9]+|search\.js\?v=[0-9]+' | sort -u
          echo ""
          echo "==============================================="
          echo "REPO-BLOB-SHA für Vergleich"
          echo "==============================================="
          git rev-parse HEAD || true
          git ls-tree HEAD zutaten/vitamin-c/index.html search.js || true
