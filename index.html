<html lang="de">
<head>

  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="stylesheet" href="news/news.css?v=1" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://hellmuth-soda.de/#website",
        "url": "https://hellmuth-soda.de/",
        "name": "Mut zur Klarheit",
        "description": "Klartext aus Forschung und Getränkewelt. Täglich kuratiert, in eigenen Worten.",
        "inLanguage": "de",
        "publisher": { "@id": "https://hellmuth-soda.de/#publisher" }
      },
      {
        "@type": "Organization",
        "@id": "https://hellmuth-soda.de/#publisher",
        "name": "Mut zur Klarheit",
        "url": "https://hellmuth-soda.de/",
        "sameAs": [
          "https://kokos-und-zitrone.de/"
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <header class="top">
    <div class="title">
      <span>News</span>
      <em data-tagline></em>
    </div>
    <a href="./" class="brand" aria-label="Hellmuth — Startseite">
      <img src="hellmuth.png" alt="Hellmuth" />
    </a>
    <button class="menu-toggle" aria-label="Menü" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="menu" aria-hidden="true">
      <a href="./" class="is-active">News</a>
      <a href="hellmuth/">Hellmuth</a>
      <a href="https://kokos-und-zitrone.de" target="_blank" rel="noopener">Sanatorium</a>
      <a href="quiz/">Quiz</a>

      <a href="klarheitskarten/">Klarheitskarten</a>
      <a href="vokabular/">Vokabular</a>
    </nav>
  </header>

  <main class="news-main">
    <div class="news-head">
      <h1>News</h1>
      <p>Klartext aus Forschung und Getränkewelt.</p>
    </div>
    <div class="news-filter" id="news-filter" role="group" aria-label="Rubrik wählen">
      <button data-filter="all" aria-pressed="true">Alle</button>
      <button data-filter="science" aria-pressed="false">Wissenschaft</button>
      <button data-filter="hellmuth" aria-pressed="false">HELLMUTH</button>
    </div>

  </main>

  <footer>
    <a href="impressum/" class="footer-impressum">Impressum</a>
  </footer>

  <script src="site.js?v=5"></script>
  <script>
    // news/data.js wird täglich vom Bot neu geschrieben; ohne Cache-Buster pro
    // Page-Load hält der Browser-Cache (GitHub-Pages-Default ~10 min) die alte
    // Liste fest. Date.now() erzwingt frische Auslieferung; news.js wartet auf
    // window.NEWS_DATA per onload.
    (function () {
      var v = '?v=' + Date.now();
      var d = document.createElement('script');
      d.src = 'news/data.js' + v;
      d.onload = function () {
        var n = document.createElement('script');
        n.src = 'news/news.js' + v;
        document.body.appendChild(n);
      };
      document.body.appendChild(d);
    })();
  </script>
</body>
</html>
