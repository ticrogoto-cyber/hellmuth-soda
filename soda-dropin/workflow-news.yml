# Soda-Repo-Variante des News-Workflows.
# Kopieren nach .github/workflows/news.yml IM SODA-REPO (nicht in hellmuth-soda).
# Unterschiede zur Sucht-Mythen-Variante: PIPELINE_RUBRIKEN=hellmuth, NEWS_THEME=soda.

name: News-Pipeline (HELLMUTH)

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Was ausführen"
        type: choice
        default: run
        options:
          - run
          - check-feeds
      max_new:
        description: "Max. neue Items (nur bei run)"
        default: "12"
      rubriken:
        description: "Rubriken, Komma-getrennt (nur bei run; Default hellmuth)"
        default: "hellmuth"
      dry_run:
        description: "Dry-Run (nichts schreiben, nur bei run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-pipeline-write
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Cron-Gate
        id: check
        env:
          ENABLED: ${{ vars.NEWS_CRON_ENABLED }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" = "schedule" ] && [ "${ENABLED}" != "true" ]; then
            MSG="Scheduled run SKIPPED — NEWS_CRON_ENABLED=${ENABLED:-unset} (set the repo variable NEWS_CRON_ENABLED=true to enable the daily cron after seed approval)"
            echo "::warning::${MSG}"
            {
              echo "### Cron skipped"
              echo ""
              echo "${MSG}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Run proceeds (event=${EVENT}, NEWS_CRON_ENABLED=${ENABLED:-unset})" >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  news:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependencies installieren
        working-directory: pipeline
        run: npm install --no-audit --no-fund

      - name: Feed-Check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'check-feeds' }}
        working-directory: pipeline
        shell: bash
        env:
          NEWS_USER_AGENT: "hellmuth-news-bot/1.0 (+https://hellmuth-soda.de)"
          WRITE_STATUS: "1"
        run: |
          set -eo pipefail
          node check-feeds.mjs | tee "$GITHUB_STEP_SUMMARY"

      - name: Pipeline-Lauf
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task == 'run') }}
        working-directory: pipeline
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_USER_AGENT: "hellmuth-news-bot/1.0 (+https://hellmuth-soda.de)"
          PIPELINE_RUBRIKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.rubriken || 'hellmuth' }}
          NEWS_THEME: "soda"
          RELEVANCE_THRESHOLD: "8"
          MAX_NEW_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_new || '12' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
        run: |
          set -eo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            MSG="ANTHROPIC_API_KEY missing — set the repo secret in Settings → Secrets and variables → Actions → Secrets"
            echo "::error::${MSG}"
            {
              echo "### Pipeline-Lauf aborted"
              echo ""
              echo "${MSG}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node run.mjs | tee "$GITHUB_STEP_SUMMARY"

      - name: Änderungen committen
        shell: bash
        run: |
          set -eo pipefail
          git config user.name "hellmuth-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news news sitemap.xml config/news-sources.json pipeline/state/seen.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "News HELLMUTH: automatischer Lauf ($(date -u +%F))"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Gepusht (Versuch $attempt)."
              exit 0
            fi
            echo "Push abgelehnt, rebase und erneut (Versuch $attempt)."
            git pull --rebase --autostash origin ${{ github.ref_name }}
          done
          echo "::error::Push nach 5 Versuchen fehlgeschlagen."
          exit 1
